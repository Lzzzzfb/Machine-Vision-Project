[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikrobot-angle-measurement"
version = "0.2.0"
description = "MV-CS050-10UC bright-slit to platform dual-plane angle measurement system"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Lzzzzfb", email = "749976124@qq.com" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
pdf = ["reportlab>=4.0", "pypdf>=4.0", "pypdfium2>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
angle-measure = "angle_measurement.cli:main"
angle-calibrate = "angle_measurement.calibration.cli:main"
angle-calibrate-pose = "angle_measurement.calibration.pose_cli:main"
angle-gui = "angle_measurement.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
